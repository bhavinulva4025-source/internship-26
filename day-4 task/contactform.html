<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futuristic Contact Form</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:#070b14;
overflow:hidden;
position:relative;
}

/* Aurora Background */
body::before,
body::after{
content:'';
position:absolute;
width:500px;
height:500px;
border-radius:50%;
filter:blur(120px);
animation:float 10s ease-in-out infinite;
}

body::before{
background:#00d9ff;
top:-150px;
left:-150px;
}

body::after{
background:#7b2cff;
bottom:-150px;
right:-150px;
animation-delay:3s;
}

@keyframes float{
50%{
transform:translateY(40px) scale(1.1);
}
}

/* Main Container */
.contact-box{
width:100%;
max-width:520px;
padding:35px;
border-radius:28px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.15);
box-shadow:
0 0 30px rgba(0,217,255,.15),
0 0 80px rgba(123,44,255,.15);
position:relative;
overflow:hidden;
animation:appear 1s ease;
}

@keyframes appear{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Animated Glow Border */
.contact-box::before{
content:'';
position:absolute;
inset:-2px;
background:linear-gradient(
90deg,
#00d9ff,
#7b2cff,
#00d9ff
);
background-size:300%;
z-index:-1;
border-radius:30px;
animation:borderGlow 5s linear infinite;
}

@keyframes borderGlow{
100%{
background-position:300%;
}
}

.title{
color:#fff;
font-size:2rem;
font-weight:700;
text-align:center;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#b6bfd1;
font-size:.95rem;
margin-bottom:28px;
}

/* Inputs */
.input-group{
position:relative;
margin-bottom:22px;
}

.input-group input,
.input-group textarea{
width:100%;
padding:16px 15px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.15);
border-radius:14px;
outline:none;
color:#fff;
font-size:15px;
transition:.35s;
}

.input-group textarea{
height:130px;
resize:none;
}

.input-group label{
position:absolute;
left:15px;
top:15px;
color:#a5adbf;
pointer-events:none;
transition:.3s;
background:transparent;
}

.input-group input:focus,
.input-group textarea:focus{
border-color:#00d9ff;
box-shadow:0 0 15px rgba(0,217,255,.35);
}

.input-group input:focus + label,
.input-group input:valid + label,
.input-group textarea:focus + label,
.input-group textarea:valid + label{
top:-10px;
left:12px;
font-size:12px;
padding:0 6px;
background:#070b14;
color:#00d9ff;
}

/* Validation */
input:valid,
textarea:valid{
border-color:#00ff99;
}

input:invalid:not(:placeholder-shown),
textarea:invalid:not(:placeholder-shown){
border-color:#ff4d6d;
}

/* Checkbox */
.checkbox{
display:flex;
gap:10px;
align-items:flex-start;
margin-bottom:20px;
color:#c7cfdf;
font-size:14px;
}

.checkbox input{
margin-top:4px;
accent-color:#00d9ff;
}

/* Button */
.btn{
width:100%;
padding:16px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:16px;
font-weight:600;
color:#fff;
background:linear-gradient(
135deg,
#00d9ff,
#7b2cff
);
position:relative;
overflow:hidden;
transition:.4s;
}

.btn:hover{
transform:translateY(-4px);
box-shadow:
0 15px 35px rgba(0,217,255,.25),
0 15px 35px rgba(123,44,255,.25);
}

.btn::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.4),
transparent
);
transition:.7s;
}

.btn:hover::before{
left:100%;
}

/* Responsive */
@media(max-width:600px){

.contact-box{
padding:25px;
}

.title{
font-size:1.7rem;
}

}
</style>
</head>
<body>

<div class="contact-box">

<h1 class="title">Get In Touch</h1>
<p class="subtitle">
Let's build something amazing together.
</p>

<form>

<div class="input-group">
<input type="text" required placeholder=" ">
<label>Full Name</label>
</div>

<div class="input-group">
<input type="email" required placeholder=" ">
<label>Email Address</label>
</div>

<div class="input-group">
<input
type="tel"
required
pattern="[0-9]{10}"
placeholder=" ">
<label>Phone Number</label>
</div>

<div class="input-group">
<input type="text" required placeholder=" ">
<label>Subject</label>
</div>

<div class="input-group">
<textarea required placeholder=" "></textarea>
<label>Your Message</label>
</div>

<div class="checkbox">
<input type="checkbox" required>
<span>I agree to the Terms & Conditions.</span>
</div>

<button type="submit" class="btn">
Send Message ✨
</button>

</form>

</div>

</body>
</html>
